<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifyd</title>
    <link rel="stylesheet" href="../CSS/step1.css" />

  </head>

  <body class="body">
    <nav class="navbar">
        <img src="../Assets/verifyd_logo.png" alt="Logo" class="logo" />
    </nav>

    <section class="nafdac">
        <h3>Step 1 . ENTER NAFDAC NUMBER</h3>

        <h1>Verify before you trust.</h1>

        <p>Confirm if a product's NAFDAC regulation number is authentic</p>

        <label>NAFDAC NUMBER <span class="required">*</span></label>

    <div class="reg-number">
        <div class="reg-prefix">REG</div>

        <input
            type="text"
            placeholder="A1 - XXXX"
        />
    </div>
    <div class="format">
        Format: A1 - 1234 . Found on the product label or packaging
    </div>

    <label>PRODUCT NAME <span class="optional-dot"> . </span><span class="optional">optional</span></label>

    <div class="product-name">
        <input
            type="text"
            placeholder="e.g. Paracetamol 500g"
        />
    </div>
    <div class="name-location">
        <div class="field">
            <label>YOUR NAME <span class="required">*</span></label>
            <input type="text" placeholder="e.g. Full Name"/>
        </div>

        <div class="field">
        <label>YOUR LOCATION <span class="required">*</span></label>
        <input type="text" placeholder="e.g. Port Harcourt, Rivers"/>
        </div>
    </div>
    </section>
  </body>
